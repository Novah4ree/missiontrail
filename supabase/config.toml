project_id = "missiontrail-local"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
major_version = 17

[studio]
enabled = true
port = 55323

[analytics]
enabled = false

[inbucket]
enabled = false

[auth]
enabled = true
site_url = "exp+missiontrail02://"
additional_redirect_urls = ["http://localhost:8081", "exp+missiontrail02://**"]
jwt_expiry = 3600
enable_signup = true

[functions.relic-field]
verify_jwt = true

[functions.daily-progress]
verify_jwt = true

[functions.relic-proximity]
verify_jwt = true

[functions.trail-discovery]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.support-request]
verify_jwt = true

[functions.verify-onboarding-id]
verify_jwt = false

[functions.mission-ai]
enabled = true
verify_jwt = false
import_map = "./functions/mission-ai/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/mission-ai/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in this function:
# static_files = [ "./functions/mission-ai/*.html" ]

[functions.verify-explorer-coin-purchase]
enabled = true
verify_jwt = true
import_map = "./functions/verify-explorer-coin-purchase/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/verify-explorer-coin-purchase/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in this function:
# static_files = [ "./functions/verify-explorer-coin-purchase/*.html" ]
